<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AstraChat</title>
    <link rel="icon" href="/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body class="chat-page">
    <main class="chat-shell" aria-label="AstraChat 聊天">
      <header class="chat-header">
        <div class="brand">
          <img src="/logo.svg" alt="" class="brand-mark">
          <div>
            <div class="brand-name">AstraChat</div>
            <div class="brand-subtitle" id="connectionStatus">正在连接</div>
          </div>
        </div>
        <button class="ghost-button" id="newChatButton" type="button">新对话</button>
      </header>

      <section class="messages" id="messages" aria-live="polite"></section>

      <section class="suggestions" aria-label="示例问题">
        <button type="button" data-suggestion="你能用很自然的语气安慰我一下吗？">安慰我一下</button>
        <button type="button" data-suggestion="帮我想一个今天晚上发朋友圈的文案。">朋友圈文案</button>
        <button type="button" data-suggestion="我想问一个很怪的问题，你先别笑。">怪问题</button>
      </section>

      <form class="composer" id="composer">
        <label class="visually-hidden" for="messageInput">输入消息</label>
        <textarea id="messageInput" rows="1" placeholder="给 AstraChat 发送消息" maxlength="2000"></textarea>
        <button class="send-button" type="submit" aria-label="发送">
          <span>发送</span>
        </button>
      </form>
    </main>
  </body>
</html>
