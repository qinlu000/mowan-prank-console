<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>魔丸</title>
    <link rel="icon" href="/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body class="chat-page">
    <main class="chat-shell" aria-label="魔丸聊天">
      <aside class="chat-sidebar" aria-label="对话导航">
        <div class="sidebar-top">
          <button class="new-chat-button" id="newChatButton" type="button">
            <span aria-hidden="true">+</span>
            <span>新对话</span>
          </button>
        </div>

        <nav class="conversation-nav" aria-label="最近对话">
          <button class="conversation-item active" type="button">
            <span class="conversation-dot" aria-hidden="true"></span>
            <span>当前对话</span>
          </button>
          <button class="conversation-item" type="button">
            <span class="conversation-dot" aria-hidden="true"></span>
            <span>创意问题</span>
          </button>
          <button class="conversation-item" type="button">
            <span class="conversation-dot" aria-hidden="true"></span>
            <span>日常助手</span>
          </button>
        </nav>

        <div class="sidebar-footer">
          <div class="mini-profile">
            <span class="mini-avatar" aria-hidden="true">A</span>
            <span>魔丸</span>
          </div>
        </div>
      </aside>

      <section class="chat-main">
        <header class="chat-header">
          <button class="model-pill" type="button">
            <span>魔丸</span>
            <span class="chevron" aria-hidden="true">⌄</span>
          </button>
          <div class="brand-subtitle" id="connectionStatus">正在连接</div>
        </header>

        <section class="messages" id="messages" aria-live="polite"></section>

        <section class="generation-actions" id="generationActions" aria-live="polite" hidden>
          <button class="secondary-action" id="stopButton" type="button" hidden>停止生成</button>
          <button class="secondary-action" id="regenerateButton" type="button" hidden>重新生成</button>
        </section>

        <section class="suggestions" aria-label="示例问题">
          <button type="button" data-suggestion="你能用很自然的语气安慰我一下吗？">安慰我一下</button>
          <button type="button" data-suggestion="帮我想一个今天晚上发朋友圈的文案。">朋友圈文案</button>
          <button type="button" data-suggestion="我想问一个很怪的问题，你先别笑。">怪问题</button>
        </section>

        <form class="composer" id="composer">
          <label class="visually-hidden" for="messageInput">输入消息</label>
          <textarea id="messageInput" rows="1" placeholder="给魔丸发送消息" maxlength="2000"></textarea>
          <button class="send-button" id="sendButton" type="submit" aria-label="发送">
            <span aria-hidden="true">↑</span>
          </button>
        </form>
      </section>
    </main>
  </body>
</html>
