name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check JavaScript
        run: pnpm run check

      - name: Verify Docker Compose deployment
        env:
          DOMAIN: :80
          VERIFY_BASE_URL: http://127.0.0.1
          ADMIN_USERS: admin:admin-pass
          VERIFY_ADMIN_USERNAME: admin
          VERIFY_ADMIN_PASSWORD: admin-pass
          COOKIE_SECRET: ci-cookie-secret
          SESSION_RETENTION_DAYS: 7
        run: sh scripts/verify-deploy.sh
