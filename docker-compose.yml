services:
  app:
    build: .
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 5173
      DATABASE_URL: file:/data/mowan.sqlite
      SESSION_RETENTION_DAYS: ${SESSION_RETENTION_DAYS:-7}
      ADMIN_USERS: ${ADMIN_USERS:?Set ADMIN_USERS in .env before starting}
      COOKIE_SECRET: ${COOKIE_SECRET:-change-this-cookie-secret}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_HTTP_REFERER: ${OPENROUTER_HTTP_REFERER:-}
      OPENROUTER_APP_TITLE: ${OPENROUTER_APP_TITLE:-Mowan}
      LLM_ENABLED: ${LLM_ENABLED:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek/deepseek-v3.2}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.7}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-900}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-45000}
      LLM_RETRY_COUNT: ${LLM_RETRY_COUNT:-2}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      QWEN_TTS_ENABLED: ${QWEN_TTS_ENABLED:-true}
      QWEN_TTS_REGION: ${QWEN_TTS_REGION:-beijing}
      QWEN_TTS_MODE: ${QWEN_TTS_MODE:-non_realtime}
      QWEN_TTS_CLONE_MODEL: ${QWEN_TTS_CLONE_MODEL:-qwen3-tts-vc-2026-01-22}
      QWEN_TTS_MODEL: ${QWEN_TTS_MODEL:-qwen3-tts-vc-2026-01-22}
      QWEN_TTS_PREFERRED_NAME: ${QWEN_TTS_PREFERRED_NAME:-mowan}
      QWEN_TTS_VOICE: ${QWEN_TTS_VOICE:-}
      QWEN_TTS_REALTIME_MODEL: ${QWEN_TTS_REALTIME_MODEL:-qwen3-tts-vc-realtime-2026-01-15}
      QWEN_TTS_REALTIME_VOICE: ${QWEN_TTS_REALTIME_VOICE:-}
      QWEN_TTS_SAMPLE_RATE: ${QWEN_TTS_SAMPLE_RATE:-24000}
      QWEN_TTS_TIMEOUT_MS: ${QWEN_TTS_TIMEOUT_MS:-45000}
      QWEN_TTS_REALTIME_CONTROLS: ${QWEN_TTS_REALTIME_CONTROLS:-false}
      QWEN_TTS_SPEECH_RATE: ${QWEN_TTS_SPEECH_RATE:-1}
      QWEN_TTS_PITCH_RATE: ${QWEN_TTS_PITCH_RATE:-1}
      QWEN_TTS_VOLUME: ${QWEN_TTS_VOLUME:-50}
      AUDIO_DIR: ${AUDIO_DIR:-/data/audio}
    volumes:
      - mowan_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/healthz | grep -q '\"ok\":true'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env before starting}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  mowan_data:
  caddy_data:
  caddy_config:
